name: Build plugin jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: mvn -B -f "$(find . -name pom.xml | head -1)" package
      - uses: actions/upload-artifact@v4
        with:
          name: MyEconomy-jar
          path: "**/target/MyEconomy-1.0.0.jar"
